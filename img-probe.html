<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>img probe</title>
  <style>
    body { background: #23262e; color: #eee; font-family: monospace; }
    .row { display: flex; gap: 20px; flex-wrap: wrap; padding: 10px; }
    .cell { text-align: center; }
    .cell img { background: #445; border: 2px solid #888; max-height: 320px; }
    .cell .cap { margin-top: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell"><img src="objects/1. painting.png"><div class="cap">1. painting.png</div></div>
    <div class="cell"><img src="objects/2. desk.png"><div class="cap">2. desk.png</div></div>
    <div class="cell"><img src="objects/6. plant.png"><div class="cap">6. plant.png</div></div>
    <div class="cell"><img src="objects/7. window.png"><div class="cap">7. window.png</div></div>
  </div>
</body>
</html>
